[project]
name = "langraph"
version = "0.1.0"
description = "LangGraph / LangChain multi-agent experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain 0.3.x stack
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-aws>=0.2",
    "langchain-experimental>=0.3",
    "langgraph>=0.3,<0.4",
    "langchainhub>=0.1.15",
    "langsmith",
    # LLM / search
    "openai>=1.40",
    "tavily-python",
    # App / data / tooling
    "streamlit",
    "pandas",
    "matplotlib",
    "faiss-cpu",
    "selenium",
    "requests",
    "httpx",
    "boto3",
    "botocore",
    "python-dotenv",
    "beautifulsoup4",
    "json5",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipython",
    "notebook",
]
